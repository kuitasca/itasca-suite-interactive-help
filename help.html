<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Interactive Help</title>

<style>
/* ================================
   LIGHT THEME
================================ */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'JetBrains Mono', monospace;
}

body {
    background-color: var(--bg-primary);
    color: var(--text-primary);
    padding: 16px;
    overflow-y: auto;
}

.label {
    font-size: 13px;
    color: var(--text-secondary);
    transition: color 0.15s ease, font-weight 0.15s ease;
}



/* ================================
   VALUE EDITORS
================================ */
.value {
    order: 1;
    display: none;
    margin-left: 22px;
    padding: 8px;
}

textarea,
input[type="text"],
input[type="number"] {
    width: 100%;
    background-color: #f5f5f5;
    color: #0f0f0f;
    border: 1px solid #cfd0d3;
    border-radius: 5px;
    padding: 6px;
    font-size: 13px;
}

textarea {
    min-height: 60px;
    resize: vertical;
}

textarea:focus,
input:focus {
    outline: none;
    border-color: var(--accent-blue);
}

input[type="checkbox"] {
    transform: scale(1.2);
}

.value input[type="checkbox"] {
  max-width: none;
  width: auto;
  transform: scale(1.2);
  margin-right: 4px;
}

/* ================================
   context menu
================================ */
.context-menu {
  position: fixed;
  background: #ffffff;
  border: 1px solid #cfcfcf;
  border-radius: 4px;
  box-shadow:
    0 2px 6px rgba(0, 0, 0, 0.15),
    0 8px 24px rgba(0, 0, 0, 0.08);
  z-index: 9999;
  min-width: 200px;
  padding: 4px 0;
  font-size: 13px;
  color: #1e1e1e;
  user-select: none;
}

.context-menu.hidden {
  display: none !important;
}

/* menu items */
.context-menu .menu-item {
  padding: 6px 14px;
  cursor: default;
  white-space: nowrap;
}

/* hover */
.context-menu .menu-item:hover {
  background-color: #e5f1fb;
}

/* active (mouse down) */
.context-menu .menu-item:active {
  background-color: #cce4f7;
}

/* optional disabled state */
.context-menu .menu-item.disabled {
  color: #a0a0a0;
  pointer-events: none;
}

/* separator */
.context-menu .separator {
  height: 1px;
  margin: 4px 0;
  background-color: #e5e5e5;
}

.arg {
  display: flex;
  align-items: center;
  gap: 6px;
}

.arg label {
  font-size: 0.85em;
  opacity: 0.7;
  white-space: nowrap;
}

.value input,
.value select {
  max-width: 140px;
}

.value input.num {
  width: 80px;          
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.vector {
  display: flex;
  gap: 4px;
}

.vector-input {
  width: 60px;
}

.arg-label {
  font-size: 0.8em;
  opacity: 0.65;
  white-space: nowrap;
}

#typeOverlay {
  position: fixed;
  right: 12px;
  bottom: 12px;

  padding: 3px 8px;

  background: rgba(30, 30, 30, 0.85);
  color: #ffffff;

  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;

  border-radius: 4px;

  pointer-events: none;
  display: none;

  opacity: 0.8;
}


ul {
  list-style: none;
  margin: 0;
  padding-left: 0;   /* ← THIS is critical */
}

li > ul {
  margin-left: 0px;    /* optional extra indent */
}

#results li.selected {
  background: #cfd0d3;
  color: white;
}

/* ================================
   palette
================================ */
.palette {
  list-style: none;
  margin: 8px 0 0;
  padding: 0;
  overflow-y: auto;
}

.palette.hidden {
  display: none;
}

.palette li {
  padding: 6px 10px;
  border-radius: 4px;
  cursor: pointer;
}

.palette li:hover {
  background: var(--bg-hover);
}
.palette li {
  color: var(--text-primary);
  font-size: 13px;
}


.palette-row {
  cursor: pointer;
}

.palette-row .label {
    font-family:
        "ITC Mixage Std Bold",
        "Express 18 Bold",
        "Segoe UI",
        sans-serif,
        "Gill Sans MT",
        "Gill Sans MT Cyrillic Pro Bold";

    font-weight: 600;
    letter-spacing: 0.2px;
}

.palette-row .value {
  margin-top: 6px;
}

.palette-row.show-value > .value {
    display: block;
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

</style>
</head>

<body tabindex="0">
<div id="typeOverlay"></div>
<div id="tree-context-menu" class="context-menu hidden">
  <div class="menu-item" id="menu-up-one-level">Up one level</div>
  <div class="separator"></div>
  <div class="menu-item" id="menu-insert-all">Insert all command</div>
  <div class="menu-item" id="menu-insert-last">Insert last command</div>
</div>

<ul id="results" class="palette"></ul>
<!--<script src="qrc:///qtwebchannel/qwebchannel.js"></script>-->
<script>
const MAX_RESULTS = 30;
const helpContext = {
  slots: [],
  groups: [],
  geometrySets: []
};
/* =======================================
   Send value changes back to Qt (JS → Qt)
========================================== */
let qtBridge = null;
let tokensFilter = [];
let currentTokenFilter = "";
let visibleRows = [];
let selectedIndex = -1;
let selectedRow = null;
let rootResults = [];
//resetTreeUI();
/*
new QWebChannel(qt.webChannelTransport, channel => {
  qtBridge = channel.objects.qtBridge;

  if (!qtBridge) {
    alert("qtBridge is NULL");
  } else {
    qtBridge.debugFromJs("qtBridge is ok");
  }
});
*/
/* ================================
   SEARCH AS IDE-like
================================ */

function searchIndex(query) {

  clearSelection();

  const tokens = query.trim()
    ? query.toLowerCase().split(/\s+/)
    : [];

  // ✅ STATE 0: initial → use cached rootResults
  if (tokens.length === 0) {
    renderResults(rootResults);

    if (visibleRows.length > 0) {
      selectedIndex = 0;
      updateSelection();
      ensureVisible(visibleRows[0]);
    }

    return;
  }

  let results = [];

  let currentNodes = __treeData;
  let path = [];

  // navigate committed tokens except last partial
  for (let i = 0; i < tokens.length - 1; i++) {

    const token = tokens[i];

    const found = currentNodes.find(n =>
      n.title.toLowerCase().startsWith(token)
    );

    if (!found) {
      currentNodes = [];
      break;
    }

    path.push(found.title.split(" ")[0]);

    currentNodes = found.children || [];
  }

  const lastToken = tokens[tokens.length - 1];

  const levelMatches = currentNodes.filter(n =>
    n.title.toLowerCase().startsWith(lastToken)
  );

  for (const node of levelMatches) {

    const name = node.title.split(" ")[0];

    const command = [...path, name].join(" ");
    const display = [...path, node.title].join(" ");

    results.push({
      label: command,
      display: display,
      item: node
    });

    // show children (only immediate children)
    if (node.children?.length) {

      for (const child of node.children) {

        const childName = child.title.split(" ")[0];

        results.push({
          label: [...path, name, childName].join(" "),
          display: [...path, name, child.title].join(" "),
          item: child
        });

      }
    }
  }

  renderResults(results);

  // select first visible
  if (visibleRows.length > 0) {
    selectedIndex = 0;
    updateSelection();
    ensureVisible(visibleRows[0]);
  }
}

function renderResults(results) {

  const rows = document.querySelectorAll("#results li");

  // reset state
  visibleRows = [];
  selectedIndex = -1;

  // clear ALL rows first
  rows.forEach(li => {
    li.style.display = "none";
    li.classList.remove("selected");
    li.__item = null;
    li.dataset.command = "";
    li.dataset.display = "";

    const label = li.querySelector(".label");
    if (label) label.textContent = "";
  });

  // populate rows
  const count = Math.min(results.length, rows.length);

  for (let i = 0; i < count; i++) {

    const result = results[i];
    const li = rows[i];

    li.style.display = "";

    const label = li.querySelector(".label");
    if (label) label.textContent = result.display;

    li.__item = result.item;

    // clean command path (for overlay/search)
    li.dataset.command = result.label;

    // full display path (for UI only)
    li.dataset.display = result.display;

    visibleRows.push(li);
  }
}

/* ================================
   CONTEXT MENU
================================ */
let contextNode = null;

const menu = document.getElementById("tree-context-menu");
const insertAllItem = document.getElementById("menu-insert-all");
const insertLastItem = document.getElementById("menu-insert-last");
const backOneLevel = document.getElementById("menu-up-one-level");

const root = document.getElementById("results");

root.addEventListener("contextmenu", e => {
  const row = e.target.closest(".palette-row");
  if (!row || !root.contains(row)) return;

  e.preventDefault();
  e.stopPropagation();

  if (selectedRow && selectedRow !== row) {
    selectedRow.classList.remove("selected", "show-value");
    selectedRow.querySelector(".value")?.remove();
  }

  row.classList.add("selected");
  selectedRow = row;

  contextNode = row;

  menu.style.left = `${e.clientX}px`;
  menu.style.top = `${e.clientY}px`;
  menu.classList.remove("hidden");
});

/* ================================
   CONTEXT MENU ACTIONS
================================ */
function callQt(action, row) {
  const item = row?.__item;
  if (!item?.id) return;

  if (qtBridge && typeof qtBridge[action] === "function") {
    qtBridge[action](item.id);
  } else {
    console.warn("Qt action not found:", action);
  }
}


insertAllItem.addEventListener("click", e => {
  e.stopPropagation();
  callQt("insertAllCommand", contextNode);
  hideContextMenu();
});

insertLastItem.addEventListener("click", e => {
  e.stopPropagation();
  callQt("insertLastCommand", contextNode);
  hideContextMenu();
});

backOneLevel.addEventListener("click", e => {
  goUpOneLevel();
  hideContextMenu();
});

menu.addEventListener("click", e => {
  e.stopPropagation();
});

function hideContextMenu() {
  menu.classList.add("hidden");
  contextNode = null;
}

document.addEventListener("click", hideContextMenu);
window.addEventListener("blur", hideContextMenu);

function goUpOneLevel() {

  const full = getFullQuery();
  if (!full) return;

  const parts = full.split(/\s+/);
  if (parts.length <= 1) return;

  // Remove last token
  parts.pop();

  // Reset state
  currentTokenFilter = "";
  tokensFilter = parts;

  clearSelection();
  updateOverlay(parts.join(" "));
  searchIndex(parts.join(" "));
}
/* ================================
   INTERACTION
================================ */
root.addEventListener("click", e => {
  if (e.target.closest(".value")) return;
  const row = e.target.closest(".palette-row");
  if (!row || !root.contains(row)) return;
  
  // -------- click on a command row will add a text on overlay-------- 
  //const commandText = row.dataset.fullpath || row.textContent.trim();
  const commandText = row.dataset.command;

  // Update overlay
  updateOverlay(commandText);

  // Update palette state
  tokensFilter = commandText.split(" ");
  currentTokenFilter = "";

  // Refresh search results
  searchIndex(commandText);

  // Reset keyboard selection index
  selectedIndex = 0;

  // ---- selection handling ----
  if (selectedRow && selectedRow !== row) {
    selectedRow.classList.remove("selected", "show-value");
    selectedRow.querySelector(".value")?.remove();
  }

  row.classList.add("selected");
  selectedRow = row;

  // ---- toggle value editor ----
  const willShow = !row.classList.contains("show-value");
  row.classList.toggle("show-value", willShow);

  if (willShow) {
    buildValueEditor(row);

    const valueDiv = row.querySelector(".value");
    requestAnimationFrame(() => ensureVisible(valueDiv));
  } else {
    row.querySelector(".value")?.remove();
  }
});

function ensureVisible(element) {
  if (!element) return;

  const rect = element.getBoundingClientRect();
  const rootRect = root.getBoundingClientRect();

  if (rect.bottom > rootRect.bottom) {
    root.scrollTop += rect.bottom - rootRect.bottom + 8;
  } else if (rect.top < rootRect.top) {
    root.scrollTop -= rootRect.top - rect.top + 8;
  }
}
function buildValueEditor(node) {
  const item = node.__item;
  if (!item) return;

  const args = Array.isArray(item.inputs) ? item.inputs : [];
  if (!args.length) return;

  let valueDiv = node.querySelector(".value");

  // toggle open/close
  if (valueDiv) {
    valueDiv.remove();
    return;
  }

  valueDiv = document.createElement("div");
  valueDiv.className = "value";
  node.appendChild(valueDiv);

  args.forEach((arg, index) => {
    const row = document.createElement("div");
    row.className = "arg";

    const inputs = [];

    const sendValues = () => {
      const values = inputs
        .flatMap(i => {
          if (i.classList?.contains("vector")) {
            return Array.from(i.querySelectorAll("input"))
              .map(v => v.value)
              .filter(Boolean)
              .join(",");
          }
          return i.type === "checkbox"
            ? (i.checked ? "1" : "0")
            : i.value;
        })
        .filter(v => v !== "");

      qtBridge?.setArgValue(item.id, index, values.join(" "));
    };

    const makeInput = () => {
      let input;
      const type = (arg.type || "").toLowerCase();

      switch (type) {

        // ------------------------
        // GROUP
        // ------------------------
        case "group":
          input = document.createElement("select");
          helpContext.groups.forEach(g => {
            const o = document.createElement("option");
            o.value = g;
            o.textContent = g;
            input.appendChild(o);
          });
          break;

        // ------------------------
        // SLOT
        // ------------------------
        case "slot":
          input = document.createElement("select");
          helpContext.slots.forEach(s => {
            const o = document.createElement("option");
            o.value = s;
            o.textContent = s;
            input.appendChild(o);
          });
          break;

        // ------------------------
        // GEOMETRY SET
        // ------------------------
        case "set":
        case "geometryset":
          input = document.createElement("select");
          helpContext.geometrySets.forEach(gs => {
            const o = document.createElement("option");
            o.value = gs;
            o.textContent = gs;
            input.appendChild(o);
          });
          break;

        // ------------------------
        // NUMERIC
        // ------------------------
        case "int":
        case "float":
          input = document.createElement("input");
          input.type = "number";
          input.step = "any";
          break;

        // ------------------------
        // VECTOR
        // ------------------------
        case "vec":
        case "vector": {
          const wrap = document.createElement("div");
          wrap.className = "vector";

          ["x", "y", "z"].forEach(axis => {
            const i = document.createElement("input");
            i.type = "number";
            i.step = "any";

            const key = `${item.id}_${index}_${arg.name}_${axis}`;
            i.id = key;
            i.name = key;
            i.onchange = sendValues;

            wrap.appendChild(i);
          });

          inputs.push(wrap);
          return wrap;
        }

        // ------------------------
        // BOOL
        // ------------------------
        case "bool":
          input = document.createElement("input");
          input.type = "checkbox";
          break;

        // ------------------------
        // DEFAULT (string / any)
        // ------------------------
        default:
          input = document.createElement("input");
          input.type = "text";
      }

      const fieldKey = `${item.id}_${index}_${arg.name}`;
      input.name = fieldKey;
      input.id = fieldKey;
      input.onchange = sendValues;

      inputs.push(input);
      return input;
    };

    // =========================
    // BUILD UI
    // =========================

    const inputsWrap = document.createElement("div");
    inputsWrap.className = "inputs";

    const firstInput = makeInput();
    inputsWrap.appendChild(firstInput);

    // ------------------------
    // LABEL
    // ------------------------
    const label = document.createElement("label");
    label.className = "arg-label";

    // Optional formatting <name>
    label.textContent = arg.optional
      ? `<${arg.name}>`
      : arg.name;

    if (firstInput?.id) {
      label.htmlFor = firstInput.id;
    }

    // ------------------------
    // REPEATABLE SUPPORT
    // ------------------------
    if (arg.repeatable) {
      const controls = document.createElement("div");
      controls.className = "repeat-controls";

      const addBtn = document.createElement("button");
      addBtn.textContent = "+";
      addBtn.onclick = e => {
        e.preventDefault();
        const extra = makeInput();
        extra.setAttribute("aria-hidden", "true");
        inputsWrap.appendChild(extra);
      };

      const delBtn = document.createElement("button");
      delBtn.textContent = "−";
      delBtn.onclick = e => {
        e.preventDefault();
        if (inputs.length > 1) {
          inputs.pop().remove();
          sendValues();
        }
      };

      controls.append(addBtn, delBtn);
      row.append(inputsWrap, controls, label);
    } else {
      row.append(inputsWrap, label);
    }

    valueDiv.appendChild(row);
  });
}

/* ================================
   ENTRY POINT FOR QT
================================ */
function resetTreeUI(data) {
    currentTokenFilter = "";
    tokensFilter = [];
    clearSelection();
    updateOverlay("");
    searchIndex("");
	// update lists
	helpContext.slots = Array.isArray(data.slots) ? data.slots : [];
	helpContext.groups = Array.isArray(data.groups) ? data.groups : [];
	helpContext.geometrySets = Array.isArray(data.geometrySets) ? data.geometrySets : [];
}


function loadTree(data) {
	__treeData = data.children;
    // ---- cache global context ----
	helpContext.slots = Array.isArray(data.slots) ? data.slots : [];
	helpContext.groups = Array.isArray(data.groups) ? data.groups : [];
	helpContext.geometrySets = Array.isArray(data.geometrySets) ? data.geometrySets : [];
  
  rootResults = __treeData.map(node => {
    const command = node.title.split(" ")[0];
    return {
      label: command,
      display: node.title,
      item: node
    };

  });

	buildPalette(MAX_RESULTS);
	//searchIndex("");
  renderResults(rootResults);

}

function parseArgsFromTitle(title) {
  if (!title) return [];

  // remove (comments)
  //title = title.replace(/<\s+/g, "<").replace(/\s+>/g, ">");
  title = title
  .replace(/<\s+/g, "<")
  .replace(/\s+>/g, ">")
  .replace(/\([^)]*\)/g, ""); // optional: remove comments early
  //console.log(title);
  const rawTokens = title.split(/\s+/).filter(Boolean);
  //
  // tokens that start an argument, not a command
  const semanticStarters = new Set([
	  "group", "groups", "slot", "by-slot", "set",
	  "i", "f", "v", "s","b"
  ]);

  let tokens;
  // If first token is semantic → keep all
  if (semanticStarters.has(rawTokens[0].replace(/[<>]/g, "").toLowerCase())) {
	  tokens = rawTokens;
  } else {
	  // otherwise drop command name
	  tokens = rawTokens.slice(1);
  }
  
  //special for id token after cmdname 
  //id should not be a token 
  if(tokens[0] == 'id') 
	tokens = tokens.slice(1);
  //console.log(tokens);
  //
  const args = [];
  
  for (let i = 0; i < tokens.length; i++) {
    let token = tokens[i];
	// ---- merge optional groups < ... > ----
	if (token.startsWith("<") && !token.endsWith(">")) {
	  let merged = token;
	  while (i + 1 < tokens.length && !tokens[i + 1].endsWith(">")) {
		merged += " " + tokens[++i];
	  }
	  if (i + 1 < tokens.length) {
		merged += " " + tokens[++i];
	  }
	  token = merged;
	}

	// ---- keyword selector (NOT an argument) ----
	if (token === "keyword") {
	  // skip optional "..."
	  if (tokens[i + 1] === "...") i++;
	  continue;
	}
	
    // repeatable
    if (token === "...") {
	  //console.log("find a repeatable one"+args)
      if (args.length) 
        args[args.length - 1].repeatable = true;
      continue;
    }

    const next = tokens[i + 1];

    // ---- semantic string selectors (consume token + s) ----
    if (
      (token === "group" ||
       token === "slot" ||
       token === "by-slot" ||
       token === "set") &&
      next === "s"
    ) {
      args.push({
        name: token,
        type:
          token === "group" ? "group" :
          token === "set" ? "geometrySets" :
          "slot",
        optional: false,
        repeatable: false
      });

      i++; // ⬅️ skip the 's'
      continue;
    }

    // ---- normal arguments ----
    const optional = token.startsWith("<");
    token = token.replace(/[<>]/g, "");

	let type = "string";
	//if(title === "extra i f1 <keyword>")
	//	console.log("FOUND IT " + token)
	// numeric (f / i) + optional index
	if (/^f\d*$/.test(token)) {
	  type = "float";
	}
	else if (/^i\d*$/.test(token)) { 
	  type = "int";
	}
	else if (/^v\d*$/.test(token)) {
	  type = "vector";
	}
	else if (/^b\d*$/.test(token)) {
	  type = "bool";
	}
	else if (token === "s") {
	  type = "string";
	}
    args.push({
      name: token,
      type,
      optional,
      repeatable: false
    });
  }

  return args;
}

///////////////////FILTER ///////////////////////////
document.addEventListener("keydown", e => {
  // Escape → reset to root
  if (e.key === "Escape") {
      // clear everything
    currentTokenFilter = "";
    tokensFilter = [];
    clearSelection();
    updateOverlay("");
    searchIndex("");
    e.preventDefault();
    return;
  }

  const el = e.target;
  if (
    el instanceof HTMLInputElement ||
    el instanceof HTMLTextAreaElement ||
    el instanceof HTMLSelectElement ||
    el.isContentEditable
  ) {
    return; // ⬅️ do NOT intercept
  }

  if (e.ctrlKey || e.metaKey || e.altKey) return;

  // Backspace
  if (e.key === "Backspace") {

    // Case 1: remove character from current token
    if (currentTokenFilter.length > 0) {
      currentTokenFilter = currentTokenFilter.slice(0, -1);
    }
    // Case 2: restore previous committed token
    else if (tokensFilter.length > 0) {
      currentTokenFilter = tokensFilter.pop();
    }
    // Case 3: nothing left → exit palette
    else {
      clearSelection();
      updateOverlay("");
      searchIndex("");
      e.preventDefault();
      return;
    }

    const q = getFullQuery();
    updateOverlay(q);
    searchIndex(q);

    e.preventDefault();
    return;
  }

  //space 
  if (e.key === " ") {
    if (currentTokenFilter.length > 0) {
      tokensFilter.push(currentTokenFilter);
      currentTokenFilter = "";
    }

    const q = getFullQuery();
    updateOverlay(q + " ");
    searchIndex(q);

    e.preventDefault();
    return;
  }

  // TAB autocomplete
  if (e.key === "Tab") {
    if (selectedIndex < 0) return;

    const li = visibleRows[selectedIndex];
    const fullPath = li.querySelector(".label").textContent;

    const tokens = fullPath.split(" ");

    tokensFilter = tokens.slice(0, tokens.length - 1);
    currentTokenFilter = tokens[tokens.length - 1];

    updateOverlay(fullPath);
    searchIndex(fullPath);

    e.preventDefault();
    return;
  }

  // RIGHT ARROW commit and descend
  if (e.key === "ArrowRight") {
    if (selectedIndex < 0) return;

    const li = visibleRows[selectedIndex];
    const fullPath = li.querySelector(".label").textContent;

    tokensFilter = fullPath.split(" ");
    currentTokenFilter = "";

    updateOverlay(fullPath + " ");
    searchIndex(fullPath);

    e.preventDefault();
    return;
  }

  if (e.key === "ArrowDown") {
    if (!visibleRows.length) return;

    if (selectedIndex < visibleRows.length - 1) {
      visibleRows[selectedIndex]?.classList.remove("selected");
      selectedIndex++;
      visibleRows[selectedIndex].classList.add("selected");
      ensureVisible(visibleRows[selectedIndex]);
    }
    updateSelection();
    e.preventDefault();
    return;
  }

  if (e.key === "ArrowUp") {
    if (!visibleRows.length) return;

    if (selectedIndex > 0) {
      visibleRows[selectedIndex]?.classList.remove("selected");
      selectedIndex--;
      visibleRows[selectedIndex].classList.add("selected");
      ensureVisible(visibleRows[selectedIndex]);
    }
    updateSelection();
    e.preventDefault();
    return;
  }

  if (e.key === "Enter") {
    if (selectedIndex < 0) return;

    const li = visibleRows[selectedIndex];

    callQt("insertAllCommand", li);

    e.preventDefault();
    return;
  }

  // Printable → start / continue palette
  if (e.key.length === 1) {
    /*if (mode !== "palette") {
      mode = "palette";
      //document.getElementById("tree").style.display = "none";
      document.getElementById("results").classList.remove("hidden");
      buildPalette(MAX_RESULTS);
    }*/

    currentTokenFilter += e.key.toLowerCase();
    const q = getFullQuery();
    updateOverlay(q);
    searchIndex(q);

    e.preventDefault();
  }
});

function updateOverlay(text) {
  const o = document.getElementById("typeOverlay");
  if (text.trim().length === 0) {
    o.textContent = "";
    o.style.display = "none";
    return;
  }
  o.textContent = text;
  o.style.display = "block";
}

function getFirstVisibleNode(ul) {
  const list = [...ul.children].filter(
    li => li instanceof HTMLLIElement && li.style.display !== "none"
  );

  console.log("visible nodes:", list.map(li =>
    li.querySelector(".label")?.textContent
  ));

  return list[0] || null;
}


function ensureChildrenCreated(li) {
  if (li.dataset.childrenCreated) return;

  const item = li.__item;
  if (!item?.children?.length) return;

  const ul = document.createElement("ul");

  for (const child of item.children) {
    ul.appendChild(createNode(child));
  }

  li.appendChild(ul);
  li.dataset.childrenCreated = "1";
}

function handleSpace() {
  if (!searchContextUL) return;

  const visible = [...searchContextUL.children].filter(
    li => li instanceof HTMLLIElement && li.style.display !== "none"
  );

  if (visible.length === 0) return;

  const li = visible[0];

  ensureChildrenCreated(li);

  const childUL = li.querySelector(":scope > ul");
  if (!childUL) return;

  // ✅ Commit token
  tokensFilter.push(currentTokenFilter);
  currentTokenFilter = "";

  // ✅ Descend
  li.classList.add("open");
  childUL.style.display = "";

  searchContextLI = li;
  searchContextUL = childUL;

  // ✅ Filter children with EMPTY token
  filterTree("");
  updateOverlay(tokensFilter.join(" ") + " ");
}


function getNodePath(li) {
  const path = [];
  while (li) {
    const label = li.querySelector(".label");
    if (label) path.unshift(label.textContent);
    li = li.parentElement?.closest("li");
  }
  return path.join(" › ");
}

function hideOutsideContext() {
  const tree = document.getElementById("tree");
  [...tree.children].forEach(li => {
    if (li !== searchContextLI && !li.contains(searchContextLI)) {
      li.style.display = searchContextLI ? "none" : "";
    }
  });
}

function handleChar(ch) {
  currentTokenFilter += ch;

  const fullQuery = getFullQuery();
  updateOverlay(fullQuery);

  /*if (mode === "tree") {
    filterTree(currentTokenFilter);
  } else {*/
    searchIndex(fullQuery);
  //}
}

function getFullQuery() {
  return [...tokensFilter, currentTokenFilter].join(" ").trim();
}

function buildPalette(rows = MAX_RESULTS) {
  const ul = document.getElementById("results");
  ul.innerHTML = "";
  ul.classList.remove("hidden");

  for (let i = 0; i < rows; i++) {
    const li = document.createElement("li");
    li.className = "palette-row";

    const label = document.createElement("span");
    label.className = "label";
    li.appendChild(label);

    ul.appendChild(li);
  }
}

/* ================================
   HIGHLIGHT WITH ARROW KEYS
================================ */

function updateSelection() {
  const list = document.getElementById("results");
  if (!list) return;

  const items = list.querySelectorAll("li");

  items.forEach((li, i) => {
    if (i === selectedIndex) {
      li.classList.add("selected");
      li.scrollIntoView({ block: "nearest" });
    } else {
      li.classList.remove("selected");
    }
  });
}

document.getElementById("results").addEventListener("mousemove", e => {
  const li = e.target.closest("li");
  if (!li) return;

  const items = [...li.parentNode.children];
  selectedIndex = items.indexOf(li);

  updateSelection();
});

function clearSelection() {
  if (!selectedRow) return;

  selectedRow.classList.remove("selected", "show-value");

  const value = selectedRow.querySelector(".value");
  if (value) value.remove();

  selectedRow = null;
}

/* ================================
   DEBUG MODE - Load from local file
================================ */
function loadFromFile() {
  console.log('Loading debug data with XMLHttpRequest...');
  
  const xhr = new XMLHttpRequest();
  xhr.open('GET', 'treedebug.txt', true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState === 4) {
      if (xhr.status === 200) {
        try {
          const data = JSON.parse(xhr.responseText);
          console.log('Loaded debug data:', data);
          loadTree(data);
        } catch (e) {
          console.error('Error parsing JSON:', e);
          alert('JSON parse error: ' + e.message);
        }
      } else {
        console.error('Error loading file:', xhr.status, xhr.statusText);
        alert(`Error ${xhr.status}: ${xhr.statusText}\n\nMake sure treedebug.txt exists.`);
      }
    }
  };
  xhr.send();
}
